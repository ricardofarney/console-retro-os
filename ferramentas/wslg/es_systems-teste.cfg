<?xml version="1.0"?>
<!-- Arcádia — sistemas do teste no WSL (3 consoles com os homebrews da prévia) -->
<systemList>
  <system>
    <name>nes</name>
    <fullname>Nintendo Entertainment System</fullname>
    <manufacturer>Nintendo</manufacturer>
    <release>1985</release>
    <hardware>console</hardware>
    <path>/storage/roms/nes</path>
    <extension>.nes .NES .zip</extension>
    <command>/home/console/arcadia-teste/lancar-jogo.sh %SYSTEM% %CORE% %ROM%</command>
    <platform>nes</platform>
    <theme>nes</theme>
    <emulators><emulator name="libretro"><cores><core default="true">fceumm</core></cores></emulator></emulators>
  </system>
  <system>
    <name>megadrive</name>
    <fullname>Sega Mega Drive</fullname>
    <manufacturer>Sega</manufacturer>
    <release>1988</release>
    <hardware>console</hardware>
    <path>/storage/roms/megadrive</path>
    <extension>.bin .md .gen .zip</extension>
    <command>/home/console/arcadia-teste/lancar-jogo.sh %SYSTEM% %CORE% %ROM%</command>
    <platform>megadrive</platform>
    <theme>megadrive</theme>
    <emulators><emulator name="libretro"><cores><core default="true">genesis_plus_gx</core></cores></emulator></emulators>
  </system>
  <system>
    <name>gbc</name>
    <fullname>Game Boy Color</fullname>
    <manufacturer>Nintendo</manufacturer>
    <release>1998</release>
    <hardware>portable</hardware>
    <path>/storage/roms/gbc</path>
    <extension>.gbc .gb .zip</extension>
    <command>/home/console/arcadia-teste/lancar-jogo.sh %SYSTEM% %CORE% %ROM%</command>
    <platform>gbc</platform>
    <theme>gbc</theme>
    <emulators><emulator name="libretro"><cores><core default="true">gambatte</core></cores></emulator></emulators>
  </system>
  <system>
    <name>snes</name>
    <fullname>Super Nintendo</fullname>
    <manufacturer>Nintendo</manufacturer>
    <release>1990</release>
    <hardware>console</hardware>
    <path>/storage/roms/snes</path>
    <extension>.sfc .smc .zip</extension>
    <command>/home/console/arcadia-teste/lancar-jogo.sh %SYSTEM% %CORE% %ROM%</command>
    <platform>snes</platform>
    <theme>snes</theme>
    <emulators><emulator name="libretro"><cores><core default="true">snes9x</core></cores></emulator></emulators>
  </system>
</systemList>
