reicast_threaded_rendering = "enabled"
parallel-n64-gfxplugin = "rice"
parallel-n64-gfxplugin-accuracy = "high"
parallel-n64-screensize = "320x240"
mame2003-plus_analog = "digital"
px68k_save_fdd_path = "disabled"
px68k_save_hdd_path = "disabled"
# Arcádia — padrões de desempenho para o S905X2 (docs/DESEMPENHO-S905X2.md)
# N64 (mupen64plus_next/GLideN64): resolução interna nativa 320x240 (o padrão do núcleo é 640x480)
mupen64plus-43screensize = "320x240"
mupen64plus-169screensize = "640x360"
# N64: quando o jogo não alcança 60 fps, repete o quadro em vez de travar o som
mupen64plus-FrameDuping = "True"
# PS1 (pcsx_rearmed): resolução nativa, sem pular quadros, renderização da GPU numa thread separada (sincronizada)
pcsx_rearmed_neon_enhancement_enable = "disabled"
pcsx_rearmed_frameskip_type = "disabled"
pcsx_rearmed_gpu_thread_rendering = "sync"
